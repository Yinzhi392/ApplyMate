name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APPLYMATE_E2E_PORT: "4189"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Install Chrome for browser tests
        run: npx playwright install --with-deps chrome

      - name: Run the complete quality gate
        run: npm run check

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics
          path: test-results/playwright
          if-no-files-found: ignore
          retention-days: 7

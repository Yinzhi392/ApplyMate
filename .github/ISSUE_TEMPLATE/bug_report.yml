name: Bug report
description: Report a reproducible ApplyMate problem using synthetic data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve ApplyMate. Never attach a real resume, raw JD screenshot, account data, credential, production export, or temporary URL.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and its user impact.
      placeholder: A concise description of the failure.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use only synthetic or anonymized data.
      placeholder: |
        1. Open ...
        2. Enter synthetic ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Mobile Web
        - CloudBase API
        - Worker / OCR / generation
        - Cleanup / lifecycle
        - Tests or developer tooling
        - Documentation
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Browser and environment
      placeholder: iOS Safari 18, local development, commit abc1234

  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Include only error codes, stages, timing, and redacted request IDs. Do not paste raw content or secrets.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed all personal data, credentials, raw user content, and temporary access URLs.
          required: true

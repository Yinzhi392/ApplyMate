name: Feature request
description: Propose a focused product or engineering improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or contributor problem should be solved?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed direction
      description: Describe the smallest useful solution and alternatives considered.
    validations:
      required: true

  - type: textarea
    id: boundaries
    attributes:
      label: Boundary impact
      description: Explain effects on truthfulness, privacy, model/OCR calls, quota, cost, identity isolation, and data retention.
      placeholder: No new model call. Adds one optional field retained for ...
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence or examples
      description: Use links or synthetic examples only. Never attach real resumes, JD screenshots, account data, or secrets.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This proposal does not automate applications or invent candidate experience.
          required: true
        - label: Any examples are synthetic or anonymized.
          required: true

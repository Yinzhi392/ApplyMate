    <text x="40" y="174" class="muted caption">排队 → OCR → 解析，可退出后恢复</text>
    <rect x="24" y="208" width="342" height="92" rx="14" class="surface"/>
    <text x="40" y="239" class="text label">空状态：还没有已确认简历</text>
    <text x="40" y="266" class="muted caption">先上传并确认，再开始生成</text>
    <rect x="24" y="312" width="342" height="104" rx="14" class="warn-soft"/>
    <text x="40" y="343" class="warning label">等待确认：岗位名缺失</text>
    <text x="40" y="370" class="warning caption">补充必填岗位名，公司名可空</text>

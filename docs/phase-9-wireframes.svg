    <text x="40" y="260" class="text heading">3 次</text>
    <text x="240" y="250" class="muted caption">失败与等待确认不扣次</text>
    <text x="24" y="314" class="text heading">添加岗位 JD</text>
    <rect x="24" y="334" width="164" height="106" rx="16" class="accent"/>
    <path d="M91 375h30M106 360v30" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <text x="73" y="419" class="white button">上传截图</text>
    <rect x="202" y="334" width="164" height="106" rx="16" class="surface"/>
    <path d="M268 366h32v29h-32zM276 358h32v29" fill="none" stroke="#4e8f7a" stroke-width="2"/>
    <text x="250" y="419" class="text button">粘贴文字</text>
    <text x="24" y="482" class="text heading">最近记录</text>
    <rect x="24" y="502" width="342" height="78" rx="14" class="surface"/>
    <text x="40" y="530" class="text label">AI 产品实习生</text>
    <text x="40" y="555" class="muted caption">贵司 · 未投递 · 10 分钟前</text>
    <rect x="24" y="592" width="342" height="78" rx="14" class="surface"/>
    <text x="40" y="620" class="text label">增长产品助理</text>
    <text x="40" y="645" class="muted caption">某科技公司 · 已投递 · 昨天</text>
    <line x1="0" y1="764" x2="390" y2="764" class="line"/>
    <text x="58" y="792" class="text label">首页</text>
    <text x="176" y="792" class="muted label">记录</text>
    <text x="301" y="792" class="muted label">我的</text>
    <rect x="55" y="808" width="34" height="4" rx="2" class="accent"/>
  </g>

  <!-- 03 简历 -->
  <g transform="translate(960 140)">
    <text x="0" y="-24" class="text screen-label">03 简历</text>
    <rect class="phone" width="390" height="844" rx="28" filter="url(#shadow)"/>

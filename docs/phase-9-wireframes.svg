    <text x="40" y="447" class="muted body">在这里粘贴岗位职责和要求…</text>
    <text x="308" y="523" class="muted caption">0 / 20000</text>
    <rect x="24" y="575" width="342" height="52" rx="12" class="accent"/>
    <text x="144" y="608" class="white button">识别并生成</text>
    <rect x="24" y="648" width="342" height="88" rx="14" class="soft"/>
    <text x="40" y="678" class="text label">当前简历：AI 产品实习</text>
    <text x="40" y="704" class="muted caption">求职偏好将作为可追溯事实参与生成</text>
  </g>

  <!-- 05 结果 -->
  <g transform="translate(80 1060)">

    <rect x="55" y="185" width="84" height="122" rx="10" class="soft"/>
    <text x="78" y="250" class="text caption">截图 1</text>
    <rect x="153" y="185" width="84" height="122" rx="10" class="soft"/>
    <text x="176" y="250" class="text caption">截图 2</text>
    <rect x="251" y="185" width="84" height="122" rx="10" fill="#fff" stroke="#4e8f7a" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="282" y="244" class="text heading">＋</text>
    <text x="271" y="270" class="muted caption">继续添加</text>

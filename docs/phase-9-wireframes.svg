    <text x="330" y="521" class="muted body">›</text>
    <rect x="24" y="553" width="342" height="52" rx="12" class="surface"/>
    <text x="40" y="585" class="text body">粘贴简历文本</text>
    <text x="330" y="585" class="muted body">›</text>

    <text x="40" y="590" class="warning caption">明日 00:00 自动恢复，不进入生成</text>
    <rect x="24" y="636" width="342" height="158" rx="14" class="danger-soft"/>
    <text x="40" y="667" class="danger heading">确认删除账号？</text>
    <text x="40" y="694" class="danger caption">此操作不可撤销，全部可关联数据将删除</text>
    <rect x="40" y="719" width="132" height="42" rx="10" class="surface"/>
    <text x="92" y="745" class="text label">取消</text>
    <rect x="186" y="719" width="156" height="42" rx="10" fill="#b34e4e"/>
    <text x="226" y="745" class="white label">确认删除</text>

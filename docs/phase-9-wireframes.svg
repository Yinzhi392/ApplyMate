<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="2050" viewBox="0 0 1900 2050">
  <defs>
    <style>
      .board { fill: #f3f0e9; }
      .phone { fill: #faf8f3; stroke: #c8d3ce; stroke-width: 2; }
      .surface { fill: #ffffff; stroke: #d6ded9; stroke-width: 1.5; }
      .soft { fill: #e4f0eb; }
      .warn-soft { fill: #f8ebdd; }
      .danger-soft { fill: #f8e6e3; }
      .accent { fill: #4e8f7a; }
      .accent-stroke { fill: none; stroke: #4e8f7a; stroke-width: 2; }
      .line { stroke: #d6ded9; stroke-width: 1.5; }
      .text { fill: #1f3144; font-family: "Noto Sans SC", "PingFang SC", sans-serif; }
      .muted { fill: #657486; font-family: "Noto Sans SC", "PingFang SC", sans-serif; }
      .white { fill: #ffffff; font-family: "Noto Sans SC", "PingFang SC", sans-serif; }
      .warning { fill: #a9602d; font-family: "Noto Sans SC", "PingFang SC", sans-serif; }
      .danger { fill: #a64646; font-family: "Noto Sans SC", "PingFang SC", sans-serif; }
      .title { font-size: 24px; font-weight: 700; }
      .heading { font-size: 18px; font-weight: 700; }
      .body { font-size: 15px; font-weight: 400; }
      .label { font-size: 13px; font-weight: 500; }
      .caption { font-size: 12px; font-weight: 400; }
      .button { font-size: 15px; font-weight: 500; }
      .board-title { font-size: 34px; font-weight: 700; }
      .screen-label { font-size: 16px; font-weight: 700; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#1f3144" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect class="board" width="1900" height="2050"/>
  <text x="80" y="58" class="text board-title">ApplyMate MVP 低保真线框</text>
  <text x="80" y="88" class="muted body">方案 A：七个核心页面 + 相邻状态板｜390 × 844｜待产品负责人确认</text>

  <!-- 01 登录 -->
  <g transform="translate(80 140)">
    <text x="0" y="-24" class="text screen-label">01 登录</text>
    <rect class="phone" width="390" height="844" rx="28" filter="url(#shadow)"/>
    <text x="24" y="62" class="text label">投了吗 · ApplyMate</text>
    <text x="24" y="128" class="text title">先把真实经历记下来</text>
    <text x="24" y="158" class="muted body">以后每次只需上传岗位 JD</text>
    <rect x="24" y="205" width="342" height="132" rx="16" class="soft"/>
    <circle cx="66" cy="251" r="20" class="accent"/>
    <path d="M57 251l7 7 13-16" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="98" y="246" class="text heading">真实优先</text>
    <text x="98" y="276" class="muted body">只使用你确认过的事实</text>
    <rect x="24" y="370" width="342" height="54" rx="12" class="surface"/>
    <text x="42" y="404" class="text body">邀请码</text>
    <text x="278" y="404" class="muted caption">请输入</text>
    <rect x="24" y="447" width="20" height="20" rx="4" class="accent-stroke"/>
    <path d="M29 457l4 4 7-9" fill="none" stroke="#4e8f7a" stroke-width="2"/>
    <text x="56" y="462" class="muted caption">我已阅读并同意用户协议与隐私政策</text>
    <rect x="24" y="494" width="342" height="52" rx="12" class="accent"/>
    <text x="145" y="527" class="white button">微信快捷登录</text>
    <text x="24" y="590" class="muted caption">管理员白名单账号同意协议后可免邀请码进入</text>
    <rect x="24" y="726" width="342" height="78" rx="12" class="warn-soft"/>
    <text x="40" y="755" class="warning label">协议版本发生实质变化</text>
    <text x="40" y="782" class="warning caption">需重新勾选同意后才能继续</text>
  </g>


    <rect x="24" y="119" width="342" height="246" rx="16" class="surface"/>
    <text x="40" y="150" class="text body">您好，我关注到贵司正在招聘 AI 产品实习生。</text>
    <text x="40" y="178" class="text body">我有需求分析、原型设计和数据复盘经验，并在</text>
    <text x="40" y="206" class="text body">项目中完成从用户访谈到迭代验证的完整流程。</text>
    <text x="40" y="247" class="text body">岗位强调快速学习与跨团队协作，这与我的项目</text>
    <text x="40" y="275" class="text body">经历较匹配。我可尽快到岗，希望有机会进一步</text>
    <text x="40" y="303" class="text body">沟通，谢谢。</text>
    <text x="40" y="341" class="muted caption">286 个可见字符 · 2 段</text>
    <rect x="24" y="381" width="164" height="48" rx="12" class="surface"/>
    <text x="84" y="411" class="text button">编辑</text>
    <rect x="202" y="381" width="164" height="48" rx="12" class="surface"/>
    <text x="247" y="411" class="text button">AI 改写</text>
    <rect x="24" y="441" width="342" height="50" rx="12" class="accent"/>
    <text x="163" y="473" class="white button">复制</text>
    <text x="24" y="530" class="text heading">为什么这样写</text>
    <rect x="24" y="550" width="342" height="82" rx="14" class="surface"/>
    <text x="40" y="578" class="text label">“需求分析、原型设计”</text>
    <text x="40" y="605" class="muted caption">来源：项目经历 fact-p-02 ↔ JD 硬技能</text>
    <rect x="24" y="644" width="342" height="82" rx="14" class="surface"/>
    <text x="40" y="672" class="text label">“可尽快到岗”</text>
    <text x="40" y="699" class="muted caption">来源：求职偏好 fact-pref-01</text>
    <text x="24" y="764" class="muted caption">复制时另起一行附加 AI 生成内容标识</text>
  </g>

  <!-- 06 记录 -->
